@let c = crew();
@let id = ids();
@if (c.naveImagen; as picture) {
  <!-- Uploaded rocket picture: replaces the whole drawing -->
  <svg class="ship" viewBox="0 0 240 150" aria-hidden="true" focusable="false">
    <image [attr.href]="picture" x="0" y="0" width="240" height="150" preserveAspectRatio="xMidYMid meet" />
  </svg>
} @else {
<svg class="ship" viewBox="0 0 240 150" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient [attr.id]="id.pasta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c9" />
      <stop offset=".22" stop-color="#f7d48f" />
      <stop offset=".6" stop-color="#eaaa5b" />
      <stop offset=".88" stop-color="#c9773f" />
      <stop offset="1" stop-color="#e9b36a" />
    </linearGradient>
    <linearGradient [attr.id]="id.tomato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d55" />
      <stop offset=".5" stop-color="#e2412c" />
      <stop offset="1" stop-color="#a4261b" />
    </linearGradient>
    <linearGradient [attr.id]="id.vape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27d4ff" />
      <stop offset="1" stop-color="#8a5cff" />
    </linearGradient>
    <clipPath [attr.id]="id.head"><circle cx="150" cy="38" r="23" /></clipPath>
  </defs>

  <!-- Engine flame, out of the rear opening -->
  <g class="ship__flame">
    <path d="M64 78C42 72 20 80 2 92C20 104 42 112 64 106Z" fill="#ff5a36" />
    <path d="M64 83C48 80 31 86 17 92C31 98 48 104 64 101Z" fill="#ffa53a" />
    <path d="M64 87C54 86 44 89 35 92C44 95 54 98 64 97Z" fill="#fff3c4" />
  </g>

  <!-- Rear fins -->
  <path d="M76 71L54 44Q60 39 68 42L104 71Z" [attr.fill]="c.color" [attr.stroke]="c.colorOscuro" stroke-width="2" stroke-linejoin="round" />
  <path d="M76 113L52 141Q59 146 67 143L104 113Z" [attr.fill]="c.colorOscuro" stroke="#1d1626" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round" />

  <!-- Back arm, behind the tube: waving, or holding the bowling ball up -->
  <g class="ship__arm ship__arm--back" [class.ship__arm--lift]="c.detras">
    <path d="M126 79Q104 70 100 50" fill="none" [attr.stroke]="c.colorOscuro" stroke-width="10" stroke-linecap="round" />
    @if (c.detras === 'bolos') {
      <circle cx="97" cy="32" r="13" fill="#3a2c86" stroke="#1d1626" stroke-width="2" />
      <path d="M89 25Q93 21 98 21" fill="none" stroke="#9d8cf2" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="94" cy="31" r="2" fill="#120d2a" />
      <circle cx="100" cy="29" r="2" fill="#120d2a" />
      <circle cx="99" cy="36" r="2" fill="#120d2a" />
    }
    <circle cx="100" cy="47" r="7" fill="#fff" stroke="#1d1626" stroke-width="2" />
  </g>

  <!-- The macaroni: ridged pasta tube -->
  <path d="M64 70H192A10 22 0 0 1 192 114H64A10 22 0 0 1 64 70Z" [attr.fill]="'url(#' + id.pasta + ')'" stroke="#a85b39" stroke-width="2" />
  @for (x of ridges; track x) {
    <path [attr.d]="'M' + x + ' 72Q' + (x - 4) + ' 92 ' + x + ' 112'" fill="none" stroke="#b5683a" stroke-width="2.5" stroke-opacity=".4" />
  }
  <path d="M72 76Q128 71 186 76" fill="none" stroke="#fff6de" stroke-width="3.5" stroke-linecap="round" stroke-opacity=".75" />
  <path d="M72 109Q128 114 186 109" fill="none" stroke="#8e4a2c" stroke-width="3" stroke-linecap="round" stroke-opacity=".3" />
  <path d="M176 71Q172 92 176 113H185Q181 92 185 71Z" [attr.fill]="c.color" />
  <text class="ship__name" [class.ship__name--flip]="flipped()" x="146" y="104" text-anchor="middle" [attr.fill]="c.colorOscuro">{{ c.nombre }}</text>

  <!-- Rear opening -->
  <ellipse cx="64" cy="92" rx="9" ry="22" fill="#d18a4c" stroke="#a85b39" stroke-width="2" />
  <ellipse cx="63" cy="92" rx="5" ry="15" fill="#3a2320" />
  <ellipse class="ship__glow" cx="63" cy="92" rx="3" ry="10" fill="#ffb35c" />

  <!-- Tomato nose cone with sauce drips -->
  <path d="M191 111Q193 123 197 111ZM202 110Q205 127 209 109Z" fill="#c8321f" />
  <path d="M190 70Q230 76 238 92Q230 108 190 114A9 22 0 0 1 190 70Z" [attr.fill]="'url(#' + id.tomato + ')'" stroke="#8d2016" stroke-width="2" />
  <path d="M200 77Q221 81 229 89" fill="none" stroke="#ffd0bf" stroke-width="3" stroke-linecap="round" stroke-opacity=".8" />
  <path d="M214 76Q218 62 232 60Q230 74 214 76Z" fill="#3fae4f" stroke="#1f6b2a" stroke-width="1.5" />
  <path d="M216 74Q222 67 229 62" fill="none" stroke="#1f6b2a" stroke-width="1" />

  <!-- Side fin -->
  <path d="M96 104L74 130Q81 135 89 131L118 108Z" [attr.fill]="c.color" [attr.stroke]="c.colorOscuro" stroke-width="2" stroke-linejoin="round" />

  <!-- Pilot: neck out of the tube, scarf and head -->
  <g class="ship__pilot">
    <ellipse cx="150" cy="71" rx="17" ry="5" fill="#6d3a26" />
    <path d="M141 56H159V72H141Z" fill="#e7b690" />
    <path class="ship__scarf" d="M137 64C119 57 104 71 82 61C94 77 116 77 139 72Z" [attr.fill]="c.color" [attr.stroke]="c.colorOscuro" stroke-width="1.5" />
    <ellipse cx="150" cy="66" rx="16" ry="6" [attr.fill]="c.color" [attr.stroke]="c.colorOscuro" stroke-width="2" />

    <!-- Bobblehead: the face is the star of the rocket -->
    <g transform="translate(150 62) scale(1.6) translate(-150 -62)">
      <g class="ship__head">
        @if (c.cabeza; as photo) {
          <circle cx="150" cy="38" r="23" fill="#f1c29c" />
          <image [attr.href]="photo" x="126" y="14" width="48" height="48" preserveAspectRatio="xMidYMid slice" [attr.clip-path]="'url(#' + id.head + ')'" />
        } @else {
          <circle cx="150" cy="38" r="23" fill="#f1c29c" />
          <path d="M127 38Q124 13 150 13Q176 13 173 38Q168 26 157 24Q150 30 139 27Q131 30 127 38Z" [attr.fill]="c.pelo" />
          <circle cx="137" cy="46" r="4" fill="#ff8f8f" fill-opacity=".45" />
          <circle cx="163" cy="46" r="4" fill="#ff8f8f" fill-opacity=".45" />
          @if (mode() === 'fall') {
            <path d="M137 36l7 7M144 36l-7 7M156 36l7 7M163 36l-7 7" stroke="#2b2230" stroke-width="2.5" stroke-linecap="round" />
            <ellipse cx="150" cy="51" rx="3.5" ry="4.5" fill="#2b2230" />
          } @else {
            <ellipse cx="141" cy="40" rx="3" ry="3.6" fill="#2b2230" />
            <ellipse cx="159" cy="40" rx="3" ry="3.6" fill="#2b2230" />
            <circle cx="142" cy="39" r="1" fill="#fff" />
            <circle cx="160" cy="39" r="1" fill="#fff" />
            <path d="M143 48Q150 55 157 48" fill="none" stroke="#2b2230" stroke-width="2.5" stroke-linecap="round" />
          }
        }
        <circle cx="150" cy="38" r="23" fill="none" stroke="#1d1626" stroke-width="2" />
        @if (mode() === 'fall') {
          <g class="ship__dizzy" fill="#ffe27a" stroke="#1d1626" stroke-width=".8">
            <path d="M130 8l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" />
            <path d="M168 4l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" />
            <path d="M150 -2l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" />
          </g>
        }
      </g>
    </g>
  </g>

  <!-- Front arm, in front of everything: their thing near the mouth -->
  <g class="ship__arm ship__arm--front">
    @switch (c.delante) {
      @case ('micro') {
        <path d="M172 82Q204 76 197 60" fill="none" [attr.stroke]="c.colorOscuro" stroke-width="10" stroke-linecap="round" />
        <path d="M197 62L186 52" stroke="#26262e" stroke-width="5" stroke-linecap="round" />
        <circle cx="182" cy="48" r="8" fill="#cfd3dc" stroke="#555a68" stroke-width="2" />
        <path d="M176 46h12M177 50h10M182 41v14" stroke="#8a90a0" stroke-width="1" />
        <circle cx="197" cy="62" r="7" fill="#fff" stroke="#1d1626" stroke-width="2" />
      }
      @case ('vaper') {
        <path d="M172 82Q206 76 199 60" fill="none" [attr.stroke]="c.colorOscuro" stroke-width="10" stroke-linecap="round" />
        <path d="M206 66L184 54L187 47L209 59Z" [attr.fill]="'url(#' + id.vape + ')'" stroke="#14161c" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M197 59L190 55L191.6 52L198.6 56Z" fill="#ff9ad5" stroke="#14161c" stroke-width="1" />
        <path d="M185 53L178 50.5L180.5 45.5L187 48Z" fill="#1a1c22" />
        <circle class="ship__led" cx="203" cy="61" r="2" fill="#eaffff" />
        <circle cx="199" cy="62" r="7" fill="#fff" stroke="#1d1626" stroke-width="2" />
      }
      @case ('mando') {
        <path d="M172 82Q200 80 199 64" fill="none" [attr.stroke]="c.colorOscuro" stroke-width="10" stroke-linecap="round" />
        <g transform="rotate(-14 206 56)">
          <path d="M190 51Q190 44 197 44H215Q222 44 222 51L225 61Q226 67 220 67Q217 67 214 63H198Q195 67 192 67Q186 67 187 61Z" fill="#2f2a3a" stroke="#14111a" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M193.5 53H200.5M197 49.5V56.5" stroke="#cfc8de" stroke-width="2.2" stroke-linecap="round" />
          <g class="ship__buttons">
            <circle cx="213" cy="50.5" r="1.8" fill="#ff5a5a" />
            <circle cx="216.8" cy="53.8" r="1.8" fill="#5ad1ff" />
            <circle cx="209.2" cy="53.8" r="1.8" fill="#ffd25a" />
            <circle cx="213" cy="57.1" r="1.8" fill="#6ee07a" />
          </g>
        </g>
        <circle cx="199" cy="63" r="7" fill="#fff" stroke="#1d1626" stroke-width="2" />
      }
      @case ('pepe') {
        <path d="M172 82Q200 80 199 66" fill="none" [attr.stroke]="c.colorOscuro" stroke-width="10" stroke-linecap="round" />
        <g class="ship__pepe">
          <path d="M191 62Q190 76 203 76Q216 76 215 62Z" fill="#2f63c9" stroke="#14254f" stroke-width="1.5" />
          <ellipse cx="203" cy="52" rx="15" ry="11.5" fill="#5aa33e" stroke="#1f4d17" stroke-width="1.5" />
          <ellipse cx="196.5" cy="45" rx="6" ry="5" fill="#fff" stroke="#1f4d17" stroke-width="1.2" />
          <ellipse cx="209.5" cy="44.5" rx="6" ry="5" fill="#fff" stroke="#1f4d17" stroke-width="1.2" />
          <circle cx="197" cy="47.3" r="2" fill="#2b1a14" />
          <circle cx="210" cy="46.8" r="2" fill="#2b1a14" />
          <path d="M190.5 44.6Q196.5 38.5 202.5 44.4ZM203.5 44Q209.5 38 215.5 44Z" fill="#5aa33e" stroke="#1f4d17" stroke-width="1.2" stroke-linejoin="round" />
          <path d="M193 57.5Q203 61.5 214 56.5" fill="none" stroke="#a8483a" stroke-width="3.2" stroke-linecap="round" />
        </g>
        <circle cx="199" cy="67" r="7" fill="#fff" stroke="#1d1626" stroke-width="2" />
      }
      @default {
        <path d="M172 80Q194 76 205 63" fill="none" [attr.stroke]="c.colorOscuro" stroke-width="10" stroke-linecap="round" />
        <circle cx="206" cy="61" r="8" fill="#fff" stroke="#1d1626" stroke-width="2" />
        <path d="M201 58h6M201 62h6" stroke="#1d1626" stroke-width="1.5" stroke-linecap="round" />
      }
    }
  </g>

  <!-- Vape clouds and song notes drift back from the mouth -->
  @if (c.delante === 'vaper' && mode() !== 'fall') {
    <g class="ship__puffs" fill="#f4f1ff" fill-opacity=".85">
      @for (r of puffs; track $index) {
        <circle cx="180" cy="46" [attr.r]="r" />
      }
    </g>
  }
  @if (c.delante === 'micro' && mode() !== 'fall') {
    <g class="ship__notes" [attr.fill]="c.color" stroke="#1d1626" stroke-width=".8">
      <text x="190" y="36">♪</text>
      <text x="190" y="36">♫</text>
    </g>
  }
</svg>
}

@if (pet(); as p) {
  <app-pixel-sprite class="ship__pet" [frame]="p.art.frames.stand" [palette]="p.art.palette" />
}

@if (mode() === 'taunt') {
  <app-pixel-sprite class="ship__finger" [frame]="middleFinger" [palette]="fingerPalette()" />
}
