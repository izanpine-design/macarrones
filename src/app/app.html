<header class="navbar site-nav">
  <div class="container">
    <a class="navbar-brand site-nav__brand" routerLink="/">Macarrones</a>
    @if (player.hasNickname()) {
      <div class="d-flex align-items-center gap-2 site-nav__player">
        <span>{{ player.nickname() }}</span>
        @if (profiles.own()) {
          <a routerLink="/ajustes" class="btn btn-sm site-nav__button">Mi nave</a>
        } @else {
          <a routerLink="/" class="btn btn-sm site-nav__button">Cambiar</a>
        }
      </div>
    }
  </div>
</header>

<main class="container pb-4 site-main">
  <router-outlet />
</main>

<app-game-backdrop />
<app-pet-layer />
<!-- Opening show: its own chunk, loaded right after the first render. -->
@defer (on immediate) {
  <app-intro />
}
